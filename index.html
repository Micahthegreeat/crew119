<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Crew 119</title>
    <style>
        .btn-large {
            /* Step 1: Make it big */
            padding: 16px 36px;       /* Top/Bottom padding, Left/Right padding */
            font-size: 20px;          /* Large, legible text size */
            font-weight: 600;         /* Semi-bold text */
            
            /* Step 2: Basic reset & shape */
            display: inline-block;    /* Allows padding/margin to work correctly on links */
            text-decoration: none;    /* Removes underline if used on an <a> link */
            border: none;             /* Removes default ugly browser borders */
            border-radius: 8px;       /* Smooth, rounded corners */
            cursor: pointer;          /* Shows the pointer finger icon on hover */
            
            /* Step 3: Colors & Typography */
            background-color: #007bff; /* Vibrant blue color */
            color: #ffffff;           /* Clean white text */
            font-family: sans-serif;  /* Clean typeface */
            
            /* Step 4: Smooth transition effect */
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
    </style>
</head>
<body>
    <a href="https://beascout.scouting.org/units/c7ab8fd2-7657-4716-ac8d-e024f01ae530" class="btn-large"> join the crew</a> <br>
    <iframe src="https://calendar.google.com/calendar/embed?src=92f97798bbe53dfccb16bc3d626ab820aa97f35922e32c00cc9155888a2c0596%40group.calendar.google.com&ctz=America%2FChicago" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
</body>
</html>
